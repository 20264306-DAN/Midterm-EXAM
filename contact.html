<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services</title>
</head>

<body style="margin: 0; 
display: flex; 
flex-direction: column; 
min-height: 100vh; 
background-color: rgb(175, 218, 255); 
text-align: center; 
font-family: sans-serif; 
overflow: hidden;"> 
    <header style="background-color: rgb(42, 65, 86); padding: 20px;">
        <h1 style="text-align: left; color: white; margin: 0 0 10px 0;">
            Dan clyde's Midterm Portfolio
        </h1>
        <hr style="border: 2px solid rgb(28, 43, 57);">
        <nav style="margin-top: 10px;">
            <a href="index.html" style="color: aliceblue; text-decoration: none;">Home</a> <strong
                style="color: rgb(28, 43, 57);">|</strong>
            <a href="about.html" style="color: aliceblue; text-decoration: none;">About</a> <strong
                style="color: rgb(28, 43, 57);">|</strong>
            <a href="contact.html" style="color: rgb(130, 159, 184); text-decoration: none;">Contact</a> <strong
                style="color: rgb(28, 43, 57);">|</strong>
            <a href="media.html" style="color: aliceblue; text-decoration: none;">Media</a> <strong
                style="color: rgb(28, 43, 57);">|</strong>
            <a href="services.html" style="color: aliceblue; text-decoration: none;">Services</a>
        </nav>
    </header>
    <hr style="border: 2px solid rgb(144, 185, 221); width: 100%;">

    <div style="flex: 1; padding: 20px;">
        <br>
        <img src="https://thumbs.dreamstime.com/b/contact-us-call-mail-icons-contact-us-call-mail-icons-white-background-vector-illustration-117513360.jpg" width="150" height="150"
            style="border-radius: 50%; object-fit: cover; border: 5px solid rgb(28, 43, 57);" alt="My Photo">
        <h1>
            Contact Details
        </h1>

        <br><br>
        <form action="#" method="POST" style="max-width: 500px; margin: 0 auto; text-align: left;">
            <fieldset style="border: 2px solid rgb(42, 65, 86); border-radius: 8px; padding: 20px; background-color: rgba(255, 255, 255, 0.5);">
                <legend style="font-weight: bold; color: rgb(42, 65, 86); padding: 0 10px; font-size: 1.1rem;">Service Inquiry Form</legend>
                
                <p>
                    <label for="fullname" style="font-weight: bold;">Full Name:</label><br>
                    <input type="text" id="fullname" name="fullname" placeholder="Full name" required minlength="3" style="width: 100%; padding: 6px; margin-top: 5px; box-sizing: border-box;">
                </p>

                <p>
                    <label for="email" style="font-weight: bold;">Email Address:</label><br>
                    <input type="email" id="email" name="email" placeholder="Email Address" required style="width: 100%; padding: 6px; margin-top: 5px; box-sizing: border-box;">
                </p>

                <p>
                    <label for="topic" style="font-weight: bold;">Inquiry Topic:</label><br>
                    <select id="topic" name="topic" required style="width: 100%; padding: 6px; margin-top: 5px; box-sizing: border-box;">
                        <option value="">--Select Inquiry Type--</option>
                        <option value="web-dev">Web Development Layouts</option>
                        <option value="ui-ux">UI/UX Design Wireframes</option>
                        <option value="copywriting">Technical Copywriting</option>
                    </select>
                </p>

                <p>
                    <label for="message" style="font-weight: bold;">Message:</label><br>
                    <textarea id="message" name="message" placeholder="How can I help you?" rows="4" required minlength="3" style="width: 100%; padding: 6px; margin-top: 5px; box-sizing: border-box; resize: none;"></textarea>
                </p>

                <p style="text-align: center; margin-bottom: 0;">
                    <button type="submit" style="padding: 10px 20px; font-weight: bold; background-color: rgb(42, 65, 86); color: white; border: none; border-radius: 4px; cursor: pointer;">Send Message</button>
                </p>
            </fieldset>
        </form>
    </div>

    <hr style="border: 2px solid rgb(144, 185, 221); width: 100%;">

    <footer style="background-color: rgb(42, 65, 86); padding: 20px; color: white;">
        <hr style="border: 2px solid rgb(28, 43, 57); margin-bottom: 15px;">
        <p style="margin: 5px 0;">
            © Developed by Dan Clyde | HUMCOM1
        </p>
    </footer>

</body>

</html>
